name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter create . --project-name camel_wallet --platforms=android
      - name: Fix Android SDK versions
        run: |
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
          sed -i "s/minSdkVersion 21/minSdkVersion 23/" android/app/build.gradle
          sed -i "s/minSdk 21/minSdk 23/" android/app/build.gradle
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: camel-wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
