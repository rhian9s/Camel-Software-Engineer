name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter create . --project-name camel_wallet --platforms=android
      - run: flutter pub get
      - run: |
          find $HOME/.pub-cache -path "*ussd_advanced*/android/build.gradle" -exec sed -i "s/1.3.50/1.9.10/g" {} \; || true
          find /opt -path "*ussd_advanced*/android/build.gradle" -exec sed -i "s/1.3.50/1.9.10/g" {} \; || true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: camel-wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
